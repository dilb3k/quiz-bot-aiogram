services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-nb_420}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  bot:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
